[package]
name = "vidi"
version = "0.1.0"
description = "Vidi tennis training visualization"
authors = ["Vidi"]
edition = "2021"

[lib]
name = "vidi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
